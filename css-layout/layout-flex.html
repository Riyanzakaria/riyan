<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Layout</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header, .footer {
            background-color: rgb(19, 231, 86);
            color: #1e1e1e;
            padding: 12px;
            text-align: center;
        }

        .navbar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            background-color: #1e1e1e;
            padding: 12px;
            gap: 24px;
        }

        .navbar > a {
            color: white;
            text-decoration: none;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
            flex: 1; 
        }

        .sidebar {
            flex: 20%;
            background-color: #1e1e1e;
            color: white;
            padding: 12px;
        }

        .main {
            flex: 70%;
            background-color: #1e1e1e;
            color: white;
            padding: 12px;
        }

        .konten, .gambar {
            width: 100%;
            height: 100px;
            background-color: rgb(19, 231, 86);
            padding: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Selamat datang di Flex Layout</h1>
        <p>Halaman ini didesain dengan Flex</p>
    </div>

    <div class="navbar">
        <a href="#">Link</a>
        <a href="#">Link</a>
        <a href="#">Link</a>
        <a href="#">Link</a>
    </div>

    <div class="content">
        <div class="sidebar">
            <h2>Ini Sidebar</h2>
            <p>Gambar saya:</p>
            <div class="gambar">Gambar</div>
        </div>
        <div class="main">
            <h2>Judul Artikel</h2>
            <p>Tanggal Artikel</p>
            <div class="konten">Konten</div>
            <h2>Judul Artikel</h2>
            <p>Tanggal Artikel</p>
            <div class="konten">Konten</div>
            <h2>Judul Artikel</h2>
            <p>Tanggal Artikel</p>
            <div class="konten">Konten</div>
            <h2>Judul Artikel</h2>
            <p>Tanggal Artikel</p>
            <div class="konten">Konten</div>
        </div>
    </div>
    
    <div class="footer">
        <h2>Footer</h2>
    </div>
</body>
</html>
