    <!-- Konten Utama (Artikel) -->
    <article>
            <h2>Form Penjadwal Pertemuan</h2>
            <form action="">
                <fieldset>
                    <legend>Informasi Pribadi</legend>
                    <label for="nama">Nama:</label>
                    <input type="text" id="nama" name="nama" required><br><br>
                    
                    <label for="telepon">No. Telepon:</label>
                    <input type="text" id="telepon" name="telepon" pattern="\d{4}-\d{5}" placeholder="XXXX-XXXXX" required><br><br>
                    
                    <label for="email">Alamat Email:</label>
                    <input type="email" id="email" name="email" placeholder="nama@domain.com" required><br><br>
                    
                    <label for="tgl_lahir">Tanggal Lahir:</label>
                    <input type="date" id="tgl_lahir" name="tgl_lahir" min="1987-01-01" max="1993-01-01" required><br><br>
                </fieldset>
            </form>
            <form action="">
                <fieldset>
                    <legend>Permintaan Pertemuan</legend>
                    <label for="tujuan">Tujuan Pertemuan:</label>
                    <input type="text" id="tujuan" name="tujuan" required><br><br>
                    
                    <label for="kepentingan">Tingkat Kepentingan Pertemuan:</label>
                    <input type="range" id="kepentingan" name="kepentingan" min="0" max="10"><br><br>
                    
                    <label for="tgl_pertemuan">Tanggal:</label>
                    <input type="date" id="tgl_pertemuan" name="tgl_pertemuan" min="" required><br><br>
                    
                    <label for="waktu">Waktu:</label>
                    <input type="time" id="waktu" name="waktu" min="17:00" max="21:00" required><br><br>
                    
                </fieldset>
                <button type="submit">Submit</button>
            </form>   
        </article>
    </section>
    <footer>
  <p>footer</p>
</footer>
</body>
<script src="../js/main.js"></script>
        
<script>
    // Mengatur tanggal minimal untuk pertemuan agar tidak bisa memilih tanggal di masa lalu
    document.getElementById("tgl_pertemuan").min = new Date().toISOString().split("T")[0];
</script>
