<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Sederhana</title>
</head>
<body>

    <form action="/action_page.php" method="get" target="_blank">
        <label for="depan">Nama Depan:</label>
        <input type="text" id="depan" name="i_name" value=""><br><br>

        <label for="n_belakang">Nama Belakang:</label>
        <input type="text" id="n_belakang" name="i_belakang" value=""><br><br>

        <input type="submit" value="Kirim">
        <input type="reset" value="Reset">
    </form>

    <p>Menekan tombol reset mengosongkan data, tombol kirim mengirim data ke server, atribut target="_blank" membuka form di tab baru, atribut _self membuka di form sekarang dan metode GET menampilkan data di URL sementara POST tidak menampilkannya.</p>

</body>
</html>
