<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .container-flex {
        display: flex;
        gap: 12px;
        background-color: deepskyblue;
        padding: 24px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .container-flex > div {
        background-color: blue;
        color: white;
        border-radius: 12px;
        padding: 12px;
      }
      h1 {
        color: rgb(255, 0, 0);
      }
    </style>
  </head>
  <body>
    <h1>JUDUL</h1>
    <h2>Membuat Container Flex</h2>
    <div class="container-flex">
      <div class="box1">Box 1</div>
      <div class="box2" style="flex-grow: 8;">Box 2</div>
      <div class="box3">Box 3</div>
      <div class="box4">Box 4</div>
    </div>
  </body>
</html>
